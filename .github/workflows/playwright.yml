name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PrismStructure/package-lock.json

      - name: Install dependencies
        working-directory: PrismStructure
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: PrismStructure
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: PrismStructure
        env:
          CI: true
          GITHUB_ACTIONS: true
        run: npm run test:ci

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright results
          path: PrismStructure/reports/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML report and failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            PrismStructure/reports/html-report/
            PrismStructure/reports/test-results/
          retention-days: 14
